version: '3.9'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: mcbeat
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mcbeat_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000

  worker:
    build: ./pipeline
    env_file: .env
    depends_on:
      - redis
      - postgres
    volumes:
      - ./pipeline:/app
    command: celery -A worker worker --loglevel=info --concurrency=2

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    env_file: .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:
